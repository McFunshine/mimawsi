# Tests only. Deliberately no AWS credentials anywhere in this file — phase 0
# runs entirely on fakes, and the deploy path is blocked on decisions recorded in
# docs/ci-cd-setup.md. RULE-17a also forbids giving Actions direct credentials to
# DynamoDB or the published S3 prefix, so the eventual deploy job will be
# narrower than "sync everything".
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Least privilege by default. Only the deploy job widens this, and only to
# id-token so it can exchange a GitHub identity token for temporary AWS
# credentials. Nothing here ever holds a long-lived key.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The browsers are already in this image, pinned to the same Playwright
    # version as tests/package.json. Installing them per run cost ten and a half
    # minutes of a twelve minute build — 94% of it — and downloaded a slightly
    # different browser build each time, so "passes in CI" meant something
    # marginally different every push. Bump this tag and the dependency together;
    # a mismatch makes Playwright refuse to start rather than fail obscurely.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001

    steps:
      - uses: actions/checkout@v4
        with:
          # The catalogue-only check diffs against the previous commit, and the
          # default shallow checkout does not fetch it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Install test dependencies
        run: npm ci
        working-directory: tests

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck
        working-directory: tests

      - name: Unit tests
        run: npm test

      # Publishing a tool changes exactly one tracked file: the catalogue index.
      # The tool's bytes are gitignored and went to S3 during review, and no code
      # is touched at all — so the browser suite is 86 seconds spent proving that
      # code nobody edited still works. The unit suite still runs, and so does the
      # build, which is what would actually catch a malformed index.
      #
      # Deliberately narrow: any other changed path, including the workflow file
      # itself, means a normal run. The failure this must not have is a code
      # change slipping through dressed as a publish.
      - name: Is this a catalogue-only change?
        id: scope
        run: |
          base='${{ github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "content_only=false" >> "$GITHUB_OUTPUT"
            echo "No previous commit to compare against; running everything."
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'
          if [ -n "$changed" ] && [ -z "$(echo "$changed" | grep -v '^packages/site/src/data/published.json$')" ]; then
            echo "content_only=true" >> "$GITHUB_OUTPUT"
            echo "Catalogue index only — skipping the browser suite."
          else
            echo "content_only=false" >> "$GITHUB_OUTPUT"
          fi

      # No browser install step: the container has them. Playwright starts the
      # catalogue, runner and api itself (webServer in playwright.config.ts), so
      # there is nothing to launch here either.
      # The pre-commit hook runs these too, but a hook is bypassable with
      # --no-verify. This is the copy that cannot be skipped, and if the two ever
      # disagree it is the hook that is wrong.
      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: End-to-end tests
        if: steps.scope.outputs.content_only != 'true'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure() && steps.scope.outputs.content_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

      # The tracer publishes real files and the teardown clears them. If anything
      # is left behind, the reset is broken and a later deploy would ship a test
      # fixture as product content.
      - name: Working tree must be clean after tests
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Tests left changes in the working tree:"
            git status --porcelain
            exit 1
          fi

  # Only from main, and only once the whole suite is green. The steps live in
  # deploy.yml because the catalogue workflow needs the same ones.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
