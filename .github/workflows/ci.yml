# Tests only. Deliberately no AWS credentials anywhere in this file — phase 0
# runs entirely on fakes, and the deploy path is blocked on decisions recorded in
# docs/ci-cd-setup.md. RULE-17a also forbids giving Actions direct credentials to
# DynamoDB or the published S3 prefix, so the eventual deploy job will be
# narrower than "sync everything".
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Least privilege by default. Only the deploy job widens this, and only to
# id-token so it can exchange a GitHub identity token for temporary AWS
# credentials. Nothing here ever holds a long-lived key.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Install test dependencies
        run: npm ci
        working-directory: tests

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck
        working-directory: tests

      - name: Unit tests
        run: npm test

      # Playwright starts the catalogue, runner and api itself (webServer in
      # playwright.config.ts), so there is nothing to launch here.
      - name: Install browsers
        run: npx playwright install --with-deps
        working-directory: tests

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

      # The tracer publishes real files and the teardown clears them. If anything
      # is left behind, the reset is broken and a later deploy would ship a test
      # fixture as product content.
      - name: Working tree must be clean after tests
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Tests left changes in the working tree:"
            git status --porcelain
            exit 1
          fi

  # Publishes the catalogue only after the whole suite is green, and only from
  # main. Deliberately narrow: the site bucket and a CDN invalidation, nothing
  # else. RULE-17a keeps Actions away from DynamoDB and the published prefix, so
  # this must never grow those permissions — publishing a tool goes through the
  # results Lambda instead.
  deploy:
    needs: test
    # Skips cleanly until the AWS role variable is set, so the build stays green
    # while the IAM side is still being wired up. It starts deploying by itself
    # the moment AWS_DEPLOY_ROLE_ARN exists — nothing here needs editing.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build catalogue
        run: npm run build --workspace @mimawsi/site
        env:
          # Unset until the runner subdomain and the API exist. The pages omit the
          # frame and the submit endpoint rather than emitting a localhost URL.
          PUBLIC_RUNNER_ORIGIN: ${{ vars.PUBLIC_RUNNER_ORIGIN }}
          PUBLIC_API_ORIGIN: ${{ vars.PUBLIC_API_ORIGIN }}

      - name: Refuse to publish a build pointing at localhost
        run: |
          if grep -rn "localhost\|127\.0\.0\.1" packages/site/dist/; then
            echo "::error::Build contains a local address; not publishing."
            exit 1
          fi
          echo "No local addresses in the build."

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish to S3
        run: |
          aws s3 sync packages/site/dist/ "s3://${{ vars.SITE_BUCKET }}/" \
            --delete \
            --cache-control "public, max-age=300, must-revalidate"

      - name: Invalidate the CDN
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DIST_ID }}" \
            --paths "/*"
