# Adding a published tool to the catalogue index.
#
# The site is a static build and lists tools from `packages/site/src/data/published.json`,
# a committed file. Publishing writes bytes to S3, which makes a tool reachable at
# its URL — but until this file changes, the catalogue does not mention it. The
# review CLI edits it on the operator's laptop and `publish.mjs` commits it; the
# approval endpoint cannot commit, so it dispatches here instead.
#
# Committing to main is not by itself enough, and the first run of this workflow
# proved it. A push authenticated with the automatic GITHUB_TOKEN never triggers
# another workflow — GitHub refuses, to stop a workflow from setting itself off
# again — so the entry landed on main, no CI run followed, and the site went on
# serving a catalogue that did not mention the tool. Every part reported success.
#
# So the deploy is called here rather than waited for. deploy.yml holds the only
# copy of those steps and CI calls the same one, which is what keeps the two from
# drifting. The alternative was to push with a personal access token so the event
# looked human; that works, but it puts a long-lived credential in the repository
# to buy something an explicit call gives for nothing.
name: Add to the catalogue

on:
  repository_dispatch:
    types: [tool-published]

permissions:
  contents: write

concurrency:
  # Two approvals in quick succession would otherwise both read the file, both add
  # one entry, and the second push would be rejected or would drop the first.
  group: catalogue
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Add the entry, if it is not already there
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          echo "$PAYLOAD" > /tmp/published.json
          node scripts/add-to-catalogue.mjs /tmp/published.json

      - name: Commit, if anything changed
        id: commit
        run: |
          echo "committed=false" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already in the catalogue; nothing to commit."
            exit 0
          fi

          # Only ever this one file. If the script touched anything else it has a
          # bug, and committing it under a message about publishing a tool is how
          # unrelated changes reach production described as something else — the
          # same guard publish.mjs applies on the operator's laptop.
          changed=$(git status --porcelain | sed 's/^...//')
          if [ "$changed" != "packages/site/src/data/published.json" ]; then
            echo "::error::unexpected changes:"; echo "$changed"; exit 1
          fi

          title=$(node -e 'console.log(require("/tmp/published.json").title)')
          git config user.name  "mimawsi"
          git config user.email "no-reply@mimawsi.com"
          git add packages/site/src/data/published.json
          git commit -m "Publish ${title}"
          git push origin main
          echo "committed=true" >> "$GITHUB_OUTPUT"

  # Rebuilding the site is what actually puts the tool on the front page. Nothing
  # but the catalogue index changed, so there is no code to test that the build
  # itself does not exercise: a malformed index fails the build, and the build is
  # the first thing deploy.yml does.
  #
  # It deploys main rather than the commit that was just made, because main is
  # what should be live; if a second approval lands first, the queued deploy
  # publishes both rather than stepping backwards over one.
  publish:
    needs: add
    if: needs.add.outputs.committed == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
