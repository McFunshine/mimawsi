# Secret scanning, on every push and every pull request.
#
# Separate from ci.yml on purpose: this must run even when the rest of CI is
# skipped or failing, because it is the only check here whose failure cannot be
# undone. A secret pushed to a public repository is compromised the moment it
# lands — deleting it later clears the tip and not the history, and crawlers watch
# public pushes in real time.
name: Secrets

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, not the tip. A secret added and removed three
          # commits ago is still published, and a shallow clone would miss it.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          version=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan
        run: gitleaks git --redact --config .gitleaks.toml --no-banner
